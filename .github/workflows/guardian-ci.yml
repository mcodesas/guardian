name: Guardian CI/CD

# CI only on promotion branch pushes; NOT on PR to conserve workflow usage.
on:
  push:
    branches: [dev, test, stage, main]
  workflow_dispatch:

concurrency:
  group: guardian-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Maven verify
        working-directory: backend
        run: mvn -B -ntp verify

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Windows agent Python syntax
        run: python -m py_compile agent/windows/guardian_agent.py agent/windows/guardian_policy.py agent/windows/guardian_locked_security.py
      - name: Native safety policy tests
        run: python -m unittest discover -s agent/windows -p 'test_*.py' -v

  windows-startup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate visible per-user scheduled task definitions
        shell: powershell
        run: .\agent\windows\test-startup.ps1

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Flutter-generated Android projects use Gradle 8.x and require JDK < 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Create official platform projects
        working-directory: apps/guardian_flutter
        run: flutter create --project-name guardian_app --org com.mcode.guardian --platforms=android,ios,windows,macos,linux .
      - name: Generate and apply official icons
        run: |
          python -m pip install Pillow
          python scripts/generate_brand_icons.py --apply
      - uses: actions/upload-artifact@v4
        with:
          name: guardian-brand-icons
          path: branding/generated
      - name: Flutter resolve
        working-directory: apps/guardian_flutter
        run: flutter pub get
      - name: Flutter analyze
        working-directory: apps/guardian_flutter
        run: flutter analyze --no-fatal-infos
      - name: Flutter unit/widget tests
        working-directory: apps/guardian_flutter
        run: flutter test
      # Android compilation is expensive; run it at stage and main only.
      # All branches still run Flutter analyze + widget tests.
      - name: Android debug smoke build
        if: github.ref == 'refs/heads/stage' || github.ref == 'refs/heads/main'
        working-directory: apps/guardian_flutter
        run: flutter build apk --debug

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [backend, agent]
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral secrets for isolated CI stack
        run: |
          echo "GUARDIAN_DB_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "GUARDIAN_AUTH_PEPPER=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "GUARDIAN_EVIDENCE_KEY_BASE64=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "GUARDIAN_API_PORT=18083" >> "$GITHUB_ENV"
          echo "GUARDIAN_DB_PORT=15433" >> "$GITHUB_ENV"
      - name: Docker Compose config
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml config --quiet
      - name: Build and run isolated PostgreSQL + API + Mailpit
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up --build --detach
      - name: Smoke test database migrations and health
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            if curl -fsS --max-time 3 http://127.0.0.1:18083/actuator/health \
                | grep -q '"status":"UP"'; then
              echo "Guardian API healthy with PostgreSQL/Flyway"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Guardian API failed Docker smoke test"
          exit 1
      - name: End-to-end account, SMTP, agent and approval API smoke
        run: python tests/smoke_api.py
      - name: Diagnostic logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail=700 --timestamps
      - name: Stop ephemeral stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down --volumes --remove-orphans

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [docker-smoke, flutter, windows-startup]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/mcodesas/guardian-api:${{ github.sha }}
            ghcr.io/mcodesas/guardian-api:latest

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment secrets
        env:
          GUARDIAN_SSH_HOST: ${{ secrets.GUARDIAN_SSH_HOST }}
          GUARDIAN_SSH_USER: ${{ secrets.GUARDIAN_SSH_USER }}
          GUARDIAN_SSH_PRIVATE_KEY: ${{ secrets.GUARDIAN_SSH_PRIVATE_KEY }}
          GUARDIAN_SSH_KNOWN_HOSTS: ${{ secrets.GUARDIAN_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in GUARDIAN_SSH_HOST GUARDIAN_SSH_USER GUARDIAN_SSH_PRIVATE_KEY GUARDIAN_SSH_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required secret $name. Not deployed."
              exit 1
            fi
          done
          [[ "$GUARDIAN_SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ ]] || exit 1
          [[ "$GUARDIAN_SSH_USER" =~ ^[a-zA-Z0-9_.-]+$ ]] || exit 1
      - name: Deploy to configured Ubuntu VPS
        env:
          GUARDIAN_SSH_HOST: ${{ secrets.GUARDIAN_SSH_HOST }}
          GUARDIAN_SSH_USER: ${{ secrets.GUARDIAN_SSH_USER }}
          GUARDIAN_SSH_PRIVATE_KEY: ${{ secrets.GUARDIAN_SSH_PRIVATE_KEY }}
          GUARDIAN_SSH_KNOWN_HOSTS: ${{ secrets.GUARDIAN_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$GUARDIAN_SSH_PRIVATE_KEY" > ~/.ssh/guardian_deploy
          printf '%s\n' "$GUARDIAN_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/guardian_deploy ~/.ssh/known_hosts
          remote="$GUARDIAN_SSH_USER@$GUARDIAN_SSH_HOST"
          ssh -i ~/.ssh/guardian_deploy -o StrictHostKeyChecking=yes "$remote" \
            'test -r /opt/guardian/.env && test -w /opt/guardian'
          scp -i ~/.ssh/guardian_deploy -o StrictHostKeyChecking=yes \
            deploy/guardian/docker-compose.prod.yml deploy/guardian/deploy.sh \
            "$remote:/opt/guardian/"
          ssh -i ~/.ssh/guardian_deploy -o StrictHostKeyChecking=yes "$remote" \
            "chmod 750 /opt/guardian/deploy.sh && /opt/guardian/deploy.sh $GITHUB_SHA"
