name: Guardian CI

# No workflows are executed on pull_request. Preserves MCode's action quota.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Syntax-check Windows Python agent
        run: python -m py_compile agent/windows/guardian_agent.py
      - name: Windows policy unit tests (no camera required)
        run: python -m unittest discover -s agent/windows -p 'test_*.py'
      - name: Java tests and package
        working-directory: backend
        run: mvn -B -ntp verify

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Generate native runner skeletons
        working-directory: apps/guardian_flutter
        run: flutter create --project-name guardian_app --org com.mcode.guardian --platforms=android,ios,windows,macos,linux .
      - name: Flutter dependencies
        working-directory: apps/guardian_flutter
        run: flutter pub get
      - name: Flutter analyze
        working-directory: apps/guardian_flutter
        run: flutter analyze --no-fatal-infos
      - name: Flutter tests
        working-directory: apps/guardian_flutter
        run: flutter test
