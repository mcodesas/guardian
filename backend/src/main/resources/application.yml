spring:
  application:
    name: guardian-backend
  datasource:
    url: ${GUARDIAN_DB_URL:jdbc:postgresql://localhost:5432/guardian}
    username: ${GUARDIAN_DB_USER:guardian}
    password: ${GUARDIAN_DB_PASSWORD}
  flyway:
    enabled: true
  mail:
    host: ${GUARDIAN_SMTP_HOST:}
    port: ${GUARDIAN_SMTP_PORT:587}
    username: ${GUARDIAN_SMTP_USERNAME:}
    password: ${GUARDIAN_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${GUARDIAN_SMTP_AUTH:true}
          starttls:
            enable: ${GUARDIAN_SMTP_STARTTLS:true}
            required: ${GUARDIAN_SMTP_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
server:
  port: 8080
  error:
    include-message: always
  forward-headers-strategy: framework
guardian:
  auth:
    pepper: ${GUARDIAN_AUTH_PEPPER}
    mail-from: ${GUARDIAN_MAIL_FROM:}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
