spring:
  application:
    name: guardian-backend
  datasource:
    url: ${GUARDIAN_DB_URL:jdbc:postgresql://localhost:5432/guardian}
    username: ${GUARDIAN_DB_USER:guardian}
    password: ${GUARDIAN_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
