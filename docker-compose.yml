services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: guardian
      POSTGRES_DB: guardian
      POSTGRES_PASSWORD: \${GUARDIAN_DB_PASSWORD:?Set GUARDIAN_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:\${GUARDIAN_DB_PORT:-5432}:5432"
    volumes:
      - guardian-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      GUARDIAN_DB_URL: jdbc:postgresql://db:5432/guardian
      GUARDIAN_DB_USER: guardian
      GUARDIAN_DB_PASSWORD: \${GUARDIAN_DB_PASSWORD:?Set GUARDIAN_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:\${GUARDIAN_API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  guardian-db:
