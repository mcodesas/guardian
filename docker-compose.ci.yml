# Integration-only SMTP test server; never include this override in production.
services:
  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - "127.0.0.1:18025:8025"
  backend:
    environment:
      GUARDIAN_SMTP_HOST: mailpit
      GUARDIAN_SMTP_PORT: 1025
      GUARDIAN_SMTP_AUTH: "false"
      GUARDIAN_SMTP_STARTTLS: "false"
      GUARDIAN_MAIL_FROM: guardian-ci@example.test
    depends_on:
      mailpit:
        condition: service_started
